# Cargo configuration for cross-compilation and optimization

[build]
# Use all available CPU cores for compilation (omit for auto-detection)
# jobs = 0

# Linux musl targets for static linking
[target.x86_64-unknown-linux-musl]
rustflags = [
		"-C", "target-feature=+crt-static",
		"-C", "link-arg=-static"
]

[target.aarch64-unknown-linux-musl]
rustflags = [
		"-C", "target-feature=+crt-static",
		"-C", "link-arg=-static"
]

# Windows MSVC targets for static linking
[target.x86_64-pc-windows-msvc]
rustflags = [
		"-C", "target-feature=+crt-static"
]

[target.aarch64-pc-windows-msvc]
rustflags = [
		"-C", "target-feature=+crt-static"
]

# macOS targets (dynamic linking).
# No `-undefined dynamic_lookup`: it defers unresolved symbols to a runtime
# flat-namespace lookup that can never succeed for compiler-rt builtins like
# ___isPlatformVersionAtLeast (static-archive-only), turning link-time errors
# into dyld crashes on users' machines. zig's bundled compiler_rt resolves
# those symbols at link time.
[target.aarch64-apple-darwin]
rustflags = []

[target.x86_64-apple-darwin]
rustflags = []

# Registry configuration
[registry]
default = "crates-io"

[registry.crates-io]
protocol = "sparse"

# Net configuration for better performance
[net]
retry = 2
git-fetch-with-cli = true

# Source replacement for faster builds (uncomment if needed)
# [source.crates-io]
# replace-with = "vendored-sources"

# [source.vendored-sources]
# directory = "vendor"

# Profile configuration for different build types
[profile.dev]
# Development profile optimizations
split-debuginfo = "unpacked"

[profile.release]
# Additional release optimizations
debug = false
debug-assertions = false
