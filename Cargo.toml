[package]
name = "octocode"
version = "0.28.1"
edition = "2021"
rust-version = "1.95"
authors = ["Muvon Un Limited <opensource@muvon.io>"]
description = "AI-powered code intelligence with semantic search, knowledge graphs, and built-in MCP server. Transform your codebase into a queryable knowledge graph for AI assistants."
homepage = "https://octomind.run/product/octocode"
repository = "https://github.com/muvon/octocode"
documentation = "https://docs.rs/octocode"
license = "Apache-2.0"
keywords = ["mcp-server", "code-intelligence", "semantic-search", "graphrag", "code-search"]
categories = ["development-tools", "command-line-utilities", "parsing", "text-processing", "algorithms"]
readme = "README.md"
exclude = [
    "tests/fixtures/*",
    "examples/*",
    ".github/*",
    "docs/*",
    "scripts/*",
    "*.md",
    "install.sh"
]

[lib]
doctest = false  # Disable doctests to avoid feature conflicts on Windows

[features]
default = ["fastembed", "huggingface", "metal"]
fastembed = ["octolib/fastembed"]
huggingface = ["octolib/huggingface"]
# Default GPU support on macOS; a no-op on other platforms.
metal = ["octolib/metal"]

# Optimized release profile for static linking
[profile.release]
lto = true              # Enable Link Time Optimization
codegen-units = 1       # Reduce parallel code generation units for better optimization
panic = "abort"         # Abort on panic for smaller binary size
strip = true            # Strip symbols from binary
opt-level = "s"         # Optimize for size, but keep loop vectorization ("z" disables it)
overflow-checks = false # Disable overflow checks in release mode

# Cross-compilation configuration is in .cargo/config.toml

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "io-std", "process", "net"] }
ignore = "0.4.34"
parking_lot = "0.13.0"
lance-table = { version = "13.0.0", default-features = false, features = [] }
lance = { version = "13.0.0", default-features = false, features = [] }
# LanceDB 0.40 job decoding requires the Http error variant provided by remote.
lancedb = { version = "0.40.0", default-features = false, features = ["remote"] }
arrow = { version = "58.4.1", default-features = false, features = ["prettyprint"] }
arrow-array = { version = "58.4.1", default-features = false }
arrow-schema = { version = "58.4.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
async-trait = "0.1.92"
tree-sitter = "0.27.1"
tree-sitter-php = "0.25.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-go = "0.25.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-lua = "0.5.0"

uuid = { version = "1.29.0", default-features = false, features = ["v4"] }
tree-sitter-typescript = "0.23.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-swift = "0.7.4"
tree-sitter-svelte-ng = "1.0.2"
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
anyhow = "1.0.104"
serde_json = "1.0.154"
sha2 = "0.11.1"
hex = "0.4.3"
ast-grep-core = "0.51.0"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
notify = { version = "8.2.1", default-features = false, features = ["crossbeam-channel", "macos_fsevent"] }
notify-debouncer-mini = "0.7.0"
toml = "1.1.8"
toml_edit = "0.25.17"
lazy_static = "1.5.1"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
globset = { version = "0.4.21", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std"] }
dirs = "7.0.0"
# EditorConfig parsing and formatting
ec4rs = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
# LSP integration dependencies
lsp-types = "0.97.0"
url = "2.5.8"
dotenvy = "0.15.7"

# Dataset export/import (octocode export | octocode import)
tar = "0.4.46"
zstd = { version = "0.14.3", default-features = false, features = ["zstdmt"] }

octolib = { version = "0.47.0", default-features = false, features = ["llm", "embeddings", "reranker"] }

# MCP SDK - official Rust implementation
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.3"  # Required for rmcp schema generation (must match rmcp's version)
hyper = { version = "1.12.0", features = ["server", "http1"] }  # Required for HTTP mode connection handling
hyper-util = { version = "0.1.21", features = ["server", "tokio", "service"] }  # Required for HTTP mode connection handling
http-body-util = "0.1.5"  # Required for proxy HTTP body types (matches rmcp's version)

# Replace esaxx-rs 0.1.10 (transitive: tokenizers/esaxx_fast → esaxx-rs/cpp).
# Upstream build.rs hardcodes cc::Build::static_crt(true), forcing /MT on
# Windows MSVC and producing LNK2038 RuntimeLibrary mismatches when linking
# with ort (pyke prebuilt onnxruntime, built /MD). Pinned by SHA so a
# force-push on the fork branch cannot silently flip our build.
# Upstream PR: https://github.com/Narsil/esaxx-rs/pull/19 (unmerged).
[dev-dependencies]
tempfile = "3.27.0"

[patch.crates-io]
esaxx-rs = { git = "https://github.com/ocentra/esaxx-rs", rev = "4f4fd5acd624e43c770a0d198fcaa9d97bfd7f0b" }

[profile.dev]
opt-level = 1          # Basic optimizations without slowing compilation too much
debug = true           # Keep debug symbols for backtraces
debug-assertions = true # Keep runtime checks
overflow-checks = true  # Keep overflow checks
lto = false            # Disable Link Time Optimization to speed up builds
codegen-units = 256    # Use more codegen units for faster parallel compilation
incremental = true     # Enable incremental compilation
rpath = false          # Disable runtime search path
