name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'  # Matches semver tags like 0.1.0, 1.0.0, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (semver format, e.g., 0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
          archive: tar.gz
        - target: aarch64-unknown-linux-musl
          os: ubuntu-22.04-arm
          archive: tar.gz
        - target: x86_64-pc-windows-msvc
          os: windows-latest
          archive: zip
        - target: aarch64-pc-windows-msvc
          os: windows-11-arm
          archive: zip
        - target: aarch64-apple-darwin
          os: macos-15
          archive: tar.gz

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      with:
        targets: ${{ matrix.target }}

    - name: Install protobuf compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Rust artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

    - name: Expose GHA cache credentials
      if: runner.os == 'Linux'
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

    - name: Create swap space for memory-intensive builds
      if: matrix.target == 'aarch64-unknown-linux-musl'
      run: |
        echo "=== Before ==="
        free -h
        swapon --show

        # Deactivate and remove existing swap (it's ~2.2GB, too small)
        EXISTING=$(swapon --noheadings --show=NAME | head -1 || true)
        if [ -n "$EXISTING" ]; then
          sudo swapoff "$EXISTING" || true
          sudo rm -f "$EXISTING"
        fi

        # Create 16GB swap — use dd as fallback if fallocate fails (btrfs/xfs)
        SWAP_PATH="/mnt/swapfile"
        sudo fallocate -l 16G "$SWAP_PATH" 2>/dev/null || \
          sudo dd if=/dev/zero of="$SWAP_PATH" bs=1M count=16384
        sudo chmod 600 "$SWAP_PATH"
        sudo mkswap "$SWAP_PATH"
        sudo swapon "$SWAP_PATH"

        echo "=== After ==="
        free -h
        swapon --show

    # Pyke ships no musl prebuilt of ONNX Runtime, so the musl targets link the
    # static library published by Muvon/onnxruntime-builds.
    - name: Download ONNX Runtime static library
      if: endsWith(matrix.target, '-unknown-linux-musl')
      shell: sh
      run: |
        asset="onnxruntime-1.24.2-${{ matrix.target }}.tar.gz"
        base="https://github.com/Muvon/onnxruntime-builds/releases/download/v1.24.2"
        curl -fsSL --retry 3 -O "$base/$asset" -O "$base/$asset.sha256"
        shasum -a 256 -c "$asset.sha256"
        mkdir onnxruntime
        tar -xzf "$asset" -C onnxruntime

    - name: Build binary
      shell: sh
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          # Linux musl: build inside Alpine and link ort-sys against the static
          # ONNX Runtime extracted by the step above. The image must stay on the
          # Alpine release that library was built on (3.22), because the archive
          # links against this image's C++ runtime.
          docker run --rm \
            --user 0:0 \
            -v "$(pwd):/workspace" \
            -w /workspace \
            rust:1.99.1-alpine3.22 \
            sh -c '
              set -eu
              apk add --no-cache \
                git perl bash musl-dev openssl-dev openssl-libs-static \
                pkgconfig gcc g++ \
                cmake make linux-headers python3 py3-pip patch

              rustup target add ${{ matrix.target }}

              # lance-encoding build.rs needs the well-known .proto includes
              # (google/protobuf/empty.proto), which only ship in protobuf-dev.
              apk add --no-cache protobuf-dev

              # A directory holding libonnxruntime.a makes ort-sys link that one archive.
              export ORT_LIB_LOCATION=/workspace/onnxruntime
              # GCC 15 (Alpine 3.23) introduced __cpu_features2 in libgcc.
              # ORT'\''s cpuid_info.cc.o references it; musl static link needs
              # libgcc.a explicitly or the symbol is undefined at link time.
              export RUSTFLAGS="-C link-arg=-lgcc"
              cargo build --release --target ${{ matrix.target }}
            '
        elif [ "${{ runner.os }}" = "Windows" ]; then
          # Pyke's prebuilt ORT static lib is compiled with /MD (dynamic CRT).
          # Rust on MSVC defaults to /MT (static CRT) → __imp_* unresolved
          # symbol errors at link time. Switch rust to dynamic CRT to match.
          # vcruntime140.dll is present on all Windows hosts.
          # (esaxx-rs is also /MT via hardcoded static_crt(true); patched via
          # [patch.crates-io] in Cargo.toml to a vendored copy with /MD.)
          export RUSTFLAGS="-C target-feature=-crt-static"
          cargo build --release --target ${{ matrix.target }}
        else
          # Native build for macOS (aarch64) — pyke ships prebuilts.
          # Pyke's ort-sys 2.0.0-rc.15 prebuilt calls ___isPlatformVersionAtLeast
          # (CoreML @available checks). It lives only in clang's compiler-rt
          # archive, which rustc does not link on macOS, so pass it explicitly.
          export RUSTFLAGS="-C link-arg=$(xcrun clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          cargo build --release --target ${{ matrix.target }}
        fi
    - name: Create archive directory
      shell: sh
      run: mkdir -p dist

    - name: Create archive (Unix)
      if: matrix.archive == 'tar.gz'
      shell: sh
      run: |
        cd target/${{ matrix.target }}/release
        case "${{ matrix.target }}" in
          *windows*)
            tar czf ../../../dist/octocode-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.tar.gz octocode.exe
            ;;
          *)
            tar czf ../../../dist/octocode-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.tar.gz octocode
            ;;
        esac

    - name: Create archive (Windows)
      if: matrix.archive == 'zip'
      shell: sh
      run: |
        cd target/${{ matrix.target }}/release
        7z a ../../../dist/octocode-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.zip octocode.exe

    - name: Create MCPB bundle
      uses: muvon/ci-workflow/actions/mcpb@master
      with:
        version: ${{ inputs.tag || github.ref_name }}
        target: ${{ matrix.target }}
        description: 'AI-powered code indexer with semantic search and knowledge graphs'
        args: '["mcp"]'

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: dist/*
        if-no-files-found: error

  publish-crate:
    name: Publish to Crates.io
    needs: build
    uses: muvon/ci-workflow/.github/workflows/rust-publish.yml@master
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      setup-protoc: true

  release:
    name: Create Release
    needs: [build, publish-crate]
    uses: muvon/ci-workflow/.github/workflows/release.yml@master
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      artifacts: 'release-*'
      draft: false
      npm-args: '["mcp"]'

  publish-npm:
    name: Publish to npm
    needs: release
    uses: muvon/ci-workflow/.github/workflows/npm-publish.yml@master
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}

  publish-mcp:
    name: Publish to MCP Registry
    needs: [release, publish-npm]
    permissions:
      id-token: write
      contents: read
    uses: muvon/ci-workflow/.github/workflows/mcp-publish.yml@master
    with:
      tag: ${{ inputs.tag }}

  notify-homebrew:
    name: Notify Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch update to homebrew-tap
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TAP_GITHUB_TOKEN }}" \
            https://api.github.com/repos/muvon/homebrew-tap/dispatches \
            -d "{\"event_type\":\"octocode-release\",\"client_payload\":{\"version\":\"${{ needs.release.outputs.version }}\"}}"


  docker:
    name: Build and Push Docker Images
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-24.04
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name
      id: repo
      run: echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Build and push Docker image by digest
      id: build
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: true
        build-args: |
          OCTOCODE_VERSION=${{ needs.release.outputs.version }}
        outputs: type=image,name=ghcr.io/${{ steps.repo.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ matrix.platform }}
        cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  docker-merge:
    name: Merge Docker Manifests
    needs: [release, docker]
    runs-on: ubuntu-latest
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name
      id: repo
      run: echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t ghcr.io/${{ steps.repo.outputs.repository }}:latest \
          -t ghcr.io/${{ steps.repo.outputs.repository }}:${{ needs.release.outputs.version }} \
          $(printf 'ghcr.io/${{ steps.repo.outputs.repository }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ghcr.io/${{ steps.repo.outputs.repository }}:latest
