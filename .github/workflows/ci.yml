name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

# A new push supersedes whatever is still running for the same branch or PR.
# The matrix here costs ~20 minutes per macOS/Windows leg, so letting several
# pushes queue up burns runners on commits nobody is looking at any more.
# Grouping by workflow + ref keeps master, each branch and each PR independent.
# Release is deliberately not covered: it is keyed on a tag and must always run
# to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: true

jobs:
  rust:
    name: Rust CI
    uses: muvon/ci-workflow/.github/workflows/rust-ci.yml@master
    with:
      feature-flags: '--all-features'
      setup-protoc: true
      # Test and coverage run in dedicated jobs below: need ONNX static libs + sccache
      test: false
      doc: false
      coverage: false

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [1.99.1]
        include:
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: nightly
    continue-on-error: ${{ matrix.rust == 'nightly' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ matrix.rust }}

    # On macos-latest the runner ships a preinstalled rust that can collide
    # with the toolchain dtolnay/rust-toolchain just installed — leaving
    # `cargo` resolving to the `rustup-init` binary rather than the proxy.
    # Force the requested toolchain as default and dump the proxy state
    # before tests run. Diagnostic output is harmless on the other runners
    # and invaluable when this breaks again.
    - name: Verify Rust toolchain
      shell: bash
      run: |
        set -x
        echo "PATH=$PATH"
        for bin in cargo rustc rustup rustup-init; do
          command -v "$bin" || true
        done
        ls -la "$HOME/.cargo/bin/" || true
        file "$HOME/.cargo/bin/cargo" || true
        rustup default "${{ matrix.rust }}" || true
        rustup show || true
        cargo --version
        rustc --version

    - name: Install protobuf compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Rust artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

    # Linux: csukuangfj ships a single bundled libonnxruntime.a — ort-sys's
    # single-file shortcut links it directly. Just point ORT_LIB_LOCATION at
    # the extracted lib/ dir. ubuntu-latest is glibc-based so the
    # glibc2_17-built static archive is ABI-compatible.
    # Windows MSVC: nothing to download — ort-sys's download-binaries feature
    # pulls pyke's prebuilts automatically; we only flip RUSTFLAGS below.
    # macOS aarch64: pyke prebuilts work out of the box.
    - name: Download ONNX Runtime static library (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        ORT_VERSION="1.24.2"
        ORT_ASSET="onnxruntime-linux-x64-static_lib-${ORT_VERSION}-glibc2_17"
        curl -sL "https://github.com/csukuangfj/onnxruntime-libs/releases/download/v${ORT_VERSION}/${ORT_ASSET}.zip" -o /tmp/ort.zip
        unzip -q /tmp/ort.zip -d /tmp/ort
        echo "ORT_LIB_LOCATION=/tmp/ort/${ORT_ASSET}/lib" >> "$GITHUB_ENV"

    - name: Run tests
      shell: bash
      env:
        RUSTC_WRAPPER: sccache
        # Windows: ORT prebuilts (pyke download-binaries) are compiled with /MD
        # (dynamic CRT). Rust on MSVC defaults to /MT (static CRT) → __imp_*
        # unresolved-symbol link errors. Switch rust to dynamic CRT to match.
        # vcruntime140.dll is present on all GitHub Windows runners.
        # (esaxx-rs is also /MT via hardcoded static_crt(true); patched via
        # [patch.crates-io] in Cargo.toml to a vendored copy with /MD.)
        RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=-crt-static' || '' }}
      run: cargo test --verbose --all-features

    - name: Check all targets (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: cargo check --all-targets --all-features

  coverage:
    name: Coverage Report
    permissions:
      contents: write # push the badge JSON to the `badges` branch
    uses: muvon/ci-workflow/.github/workflows/rust-coverage.yml@master
    with:
      feature-flags: '--all-features'
      ignore-filename-regex: '(_tests?\.rs|/tests\.rs)$'
      setup-protoc: true
      setup-script: |
        ORT_VERSION="1.24.2"
        ORT_ASSET="onnxruntime-linux-x64-static_lib-${ORT_VERSION}-glibc2_17"
        curl -sL "https://github.com/csukuangfj/onnxruntime-libs/releases/download/v${ORT_VERSION}/${ORT_ASSET}.zip" -o /tmp/ort.zip
        unzip -q /tmp/ort.zip -d /tmp/ort
        echo "ORT_LIB_LOCATION=/tmp/ort/${ORT_ASSET}/lib" >> "$GITHUB_ENV"
  musl-build:
    name: Musl Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Pyke ships no musl prebuilt of ONNX Runtime, so the musl targets link the
    # static library published by Muvon/onnxruntime-builds.
    - name: Download ONNX Runtime static library
      run: |
        asset="onnxruntime-1.24.2-${{ matrix.target }}.tar.gz"
        base="https://github.com/Muvon/onnxruntime-builds/releases/download/v1.24.2"
        curl -fsSL --retry 3 -O "$base/$asset" -O "$base/$asset.sha256"
        shasum -a 256 -c "$asset.sha256"
        mkdir onnxruntime
        tar -xzf "$asset" -C onnxruntime

    - name: Cache cargo registry and target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: docker-alpine-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          docker-alpine-${{ matrix.target }}-cargo-

    - name: Build in Alpine (mirrors release pipeline)
      run: |
        # The image must stay on the Alpine release the ONNX Runtime library was
        # built on (3.22), because the archive links against this image's C++ runtime.
        docker run --rm \
          --user 0:0 \
          -v "$(pwd):/workspace" \
          -w /workspace \
          rust:1.99.1-alpine3.22 \
          sh -c '
            set -eu
            apk add --no-cache \
              git perl bash musl-dev openssl-dev openssl-libs-static \
              pkgconfig gcc g++ \
              cmake make linux-headers python3 py3-pip patch

            rustup target add ${{ matrix.target }}

            # lance-encoding build.rs needs the well-known .proto includes
            # (google/protobuf/empty.proto), which only ship in protobuf-dev.
            apk add --no-cache protobuf-dev

            # A directory holding libonnxruntime.a makes ort-sys link that one archive.
            export ORT_LIB_LOCATION=/workspace/onnxruntime
            export RUSTFLAGS="-C link-arg=-lgcc"
            cargo build --target ${{ matrix.target }}
          '

  brief:
    uses: muvon/ci-workflow/.github/workflows/brief.yml@master
    secrets: inherit
